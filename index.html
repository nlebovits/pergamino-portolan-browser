<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" id="meta-description" content="">
    <meta name="og:type" content="website">
    <meta name="og:url" id="og-url" content="<%- catalogUrl %>">
    <meta property="og:title" id="og-title" content="<%- catalogTitle %>"/>
    <meta name="og:description" id="og-description" content="">
    <meta name="og:locale" id="og-locale" content="es_AR">
    <meta name="og:site_name" content="<%- catalogTitle %>">
    <!--RC
    <base href="<%- pathPrefix %>" id="stac-browser-base">
    <script defer="defer" src="./runtime-config.js"></script>
    RC-->
    <link rel="icon" type="image/png" sizes="32x32" href="<%- pathPrefix %>pergamino/favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="<%- pathPrefix %>pergamino/favicon-192.png">
    <link rel="apple-touch-icon" href="<%- pathPrefix %>pergamino/apple-touch-icon.png">
    <meta name="theme-color" content="#fbcd49">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- GeoNode self-hosts Montserrat 300, 400 and 700 (/static/fonts/montserrat.css).
         Load the same weights so a CSS weight of 600 falls back to 700, as it does there. -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,700;1,400&display=swap" rel="stylesheet">
    <title><%- catalogTitle %></title>
  </head>
  <body>
    <noscript>
      <strong>El navegador de datos de la IDE Pergamino necesita JavaScript. Actívelo para continuar.</strong>
    </noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
