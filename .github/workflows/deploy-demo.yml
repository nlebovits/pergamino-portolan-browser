name: Deploy to GitHub Pages
# IDE Pergamino: each push to main publishes the site. Run this workflow by
# hand to publish main again without a new commit.
on:
  push:
    branches: [main]
  workflow_dispatch:
# A newer push replaces a deployment that has not finished.
concurrency:
  group: deploy-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # The site is a project page at /pergamino-portolan-browser/.
      SB_pathPrefix: "/pergamino-portolan-browser/"
      SB_historyMode: "hash"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          exclude_assets: 'report.html'
