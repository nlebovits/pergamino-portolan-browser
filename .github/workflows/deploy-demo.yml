name: Deploy to GitHub Pages
# IDE Pergamino: deploy by hand only. A push to main does not publish the
# site. Run this workflow when a deployment is approved.
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # The site is a project page at /pergamino-portolan-browser/.
      SB_pathPrefix: "/pergamino-portolan-browser/"
      SB_historyMode: "hash"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          exclude_assets: 'report.html'
