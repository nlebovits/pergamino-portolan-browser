name: Integration Tests — Code Generators

on:
  pull_request:
    branches:
      - main
      - v6
    paths:
      - 'src/codegen/**'
      - 'tests/integration/**'
      - '.github/workflows/codegen-integration.yml'
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

jobs:
  codegen-integration:
    name: Run generated code (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript, r, csharp, java, rust]

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ${{ matrix.language }} integration
        run: bash tests/integration/run-tests.sh ${{ matrix.language }}
